# CI клиента Сакуры (desktop/): ядро на Python и интерфейс на Electron/React. Сервер (sakura_core/) — отдельно.
name: desktop-ci

on:
  push:
    branches: [master, "feat/unified-client"]
    paths: ["desktop/**", "agent/requirements.lock.txt", ".github/workflows/desktop-ci.yml"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop-ci.yml"]
  workflow_dispatch:

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Ядро (pytest, ruff)
    runs-on: windows-latest
    permissions:
      contents: write   # только ветка ci/desktop-results
    timeout-minutes: 40
    env:
      SAKURA_NO_DOTENV: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            agent/requirements.lock.txt
            desktop/requirements.txt
      - name: Зависимости
        run: >
          python -m pip install -r agent/requirements.lock.txt -r desktop/requirements.txt pytest ruff
          --extra-index-url https://download.pytorch.org/whl/cpu
      - name: ruff
        run: python -m ruff check desktop
      - name: pytest
        shell: bash
        run: |
          set -o pipefail
          python -m pytest desktop/tests -q -rfE -p no:cacheprovider 2>&1 | tee pytest.txt
      # Сводка падений — в ветку ci/desktop-results (логи Actions без авторизации не читаются).
      - name: Сводка pytest → ci/desktop-results
        if: failure()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/r" && grep -E "^(FAILED|ERROR)|passed|failed|^E  " pytest.txt | head -400 > "$RUNNER_TEMP/r/pytest-windows.txt" || true
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci/desktop-results
          git rm -rfq . >/dev/null
          cp "$RUNNER_TEMP/r/pytest-windows.txt" .
          git add pytest-windows.txt
          git commit -qm "ci(desktop): pytest Windows ${GITHUB_SHA::7}"
          git push -f origin HEAD:ci/desktop-results

  ui:
    name: Интерфейс (tsc, eslint, vitest, сборка, e2e)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json
      - run: npm ci
      - name: tsc
        run: npx tsc --noEmit -p . && npx tsc -p tsconfig.electron.json --noEmit
      - name: eslint
        run: npx eslint src electron scripts
      - name: vitest
        run: npx vitest run
      - name: Сборка
        run: npm run build
      - name: e2e (Playwright в Electron)
        # Electron на раннере без интерактивного рабочего стола может не стартовать — не блокирует CI.
        continue-on-error: true
        run: npm run e2e
