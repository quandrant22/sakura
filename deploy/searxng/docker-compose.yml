# SearXNG для Сакуры: свой метапоисковик, только на localhost (наружу не торчит).
# Установка: scripts/install_searxng.sh. Сакура: SEARXNG_URL=http://127.0.0.1:8888
services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: sakura-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    env_file:
      - ./searxng.env          # SEARXNG_SECRET, создаётся установщиком, в git не попадает
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8888/
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    logging:
      driver: json-file
      options: {max-size: "1m", max-file: "1"}
