# /etc/systemd/system/sakura.service.d/wss.conf — WebSocket только на
# localhost: снаружи — wss:// через nginx → Caddy (docs/wss.md).
# Если в /opt/sakura/.env задан WS_HOST — он должен быть 127.0.0.1 или
# удалён (иначе значение из .env может перекрыть это).
[Service]
Environment=WS_HOST=127.0.0.1
