# Вопросы про планы и дела (perf/voice-2: лёгкий голосовой профиль
# возвращает блок задач по словам «сегодня», «задач», «план», «дедлайн»…).
category: вопросы про планы
defaults:
  channel: voice
  rules:
    max_sentences: 3
scenarios:
  - id: plan-01
    user: Что у меня на сегодня?
    expect: Перечислить дела на сегодня из задач и календаря; если их нет — честно сказать, не выдумывать.
  - id: plan-02
    user: Какие у меня задачи?
    expect: Коротко назвать открытые задачи из списка; без выдуманных пунктов.
  - id: plan-03
    user: Есть дедлайны на этой неделе?
    expect: Назвать сроки, если они есть в задачах; иначе сказать, что сроков не видно.
  - id: plan-04
    user: Что я планировал на выходные?
    expect: Опираться только на известные планы; не знает — так и сказать.
  - id: plan-05
    user: Сколько дел у меня осталось?
    expect: Число или короткий перечень открытых дел без выдумок.
  - id: plan-06
    user: Какое у меня расписание на завтра?
    expect: Расписание из календаря/задач или честное «не вижу расписания».
