# Длинные запросы: здесь можно развернуться, но по делу и без markdown в Telegram.
category: длинные запросы
defaults:
  channel: chat
  rules: {max_sentences: 12, no_markdown: true}
scenarios:
  - id: long-01
    user: "Объясни подробно, как работает кэш процессора, своими словами."
    expect: "Развёрнуто и понятно; без заголовков и звёздочек."
  - id: long-02
    user: "Составь план на выходные: мне надо доделать сервер, сходить в магазин и отдохнуть. Расскажи по порядку."
    expect: "План текстом, без markdown; без поучений."
  - id: long-03
    user: "Расскажи историю создания Linux коротко, в пять-шесть предложений."
    expect: "5–6 предложений, фактически аккуратно."
    rules: {max_sentences: 8}
  - id: long-04
    user: "Мне нужно выбрать между двумя видеокартами: одна дешевле, другая тише. Что важнее для дома, если я играю по вечерам? Рассуди."
    expect: "Рассуждение с выводом; без выдуманных цен."
