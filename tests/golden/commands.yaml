# Команды: ответ — короткий статус-отчёт, без суеты и без пустых вопросов.
category: команды
defaults:
  channel: voice
  rules: {max_sentences: 2, no_question_end: true, no_exclaim: true}
scenarios:
  - id: cmd-01
    user: "Открой стим."
    expect: "Одна фраза-статус: запускаю / сделано. Без комментариев про игры."
  - id: cmd-02
    user: "Сделай потише на двадцать."
    expect: "Статус в одну фразу."
  - id: cmd-03
    user: "Выключи компьютер через минуту."
    expect: "Короткое подтверждение или уточнение; без шутки с развитием."
  - id: cmd-04
    user: "Поставь музыку."
    expect: "Статус: включаю."
  - id: cmd-05
    user: "Закрой браузер, мне надо работать."
    expect: "Статус; без советов про работу."
    rules: {must_not: ["продуктив", "удачи в работе", "не отвлекайтесь"]}
  - id: cmd-06
    user: "Открой приложение Блокнот, если оно есть."
    expect: "Статус или честное «не нашла»."
  - id: cmd-07
    user: "Громкость на семьдесят."
    expect: "Короткий статус; можно назвать уровень."
  - id: cmd-08
    user: "Сделай скриншот и скажи, что на экране."
    channel: chat
    expect: "Честно: скриншота в этом разговоре нет — не выдумывать содержимое экрана."
    rules: {must_not: ["на экране (открыт|видно|виден)"]}
