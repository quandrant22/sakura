# Память: только то, что есть в памяти; «не помню» лучше выдумки.
category: память
defaults:
  channel: voice
  rules: {max_sentences: 3}
scenarios:
  - id: mem-01
    user: "Что я говорил про RX-8?"
    expect: "Факты из памяти, если есть; иначе «не помню» без выдумки."
  - id: mem-02
    user: "Что ты помнишь о вчерашнем вечере?"
    expect: "Только из памяти/резюме; без выдуманных деталей."
  - id: mem-03
    user: "Как зовут мою собаку?"
    expect: "Если нет в памяти — «не помню»; не выдумывать кличку."
    rules: {must_not: ["зовут (Рекс|Шарик|Бобик|Барон)"]}
  - id: mem-04
    user: "В какие игры я играю чаще всего?"
    expect: "Из памяти/Steam-контекста, без выдуманных часов."
  - id: mem-05
    user: "Какой у меня любимый жанр музыки?"
    expect: "Из памяти, если есть; можно признать неуверенность."
  - id: mem-06
    user: "Напомни, о чём мы договорились в прошлый раз."
    expect: "Из резюме прошлого разговора; без выдумки."
