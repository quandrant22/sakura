# Названия на латинице: понимает, отвечает по-русски, без транслитерационной каши.
category: латиница
defaults:
  channel: voice
  rules: {max_sentences: 2}
scenarios:
  - id: lat-01
    user: "Что думаешь про Palworld?"
    expect: "Короткое мнение; название не искажено."
  - id: lat-02
    user: "Steam обновился?"
    expect: "Честно: знает или нет."
  - id: lat-03
    user: "Включи что-нибудь из Kordhell."
    expect: "Статус; без длинного комментария о жанре."
  - id: lat-04
    user: "У меня в Discord кто-то пишет, глянь."
    expect: "Честно о возможностях; без выдуманных сообщений."
  - id: lat-05
    user: "Valheim или Abiotic Factor на вечер?"
    expect: "Выбор одной-двумя фразами."
