    pattern: 'нажми\s+(?:сочетание\s+|клавиши\s+)?((?:контрол|контрл|альт|шифт|вин|ctrl|alt|shift|win)\b.*)'
    required: ask

- id: keys.media
  desc: 'Медиаклавиша: пауза, следующий, предыдущий, громче, тише, без звука'
  executor: agent
  reversible: true
  confirm: false
  followup: ack
  triggers: ['медиаклавиша', 'следующий трек клавишей', 'предыдущий трек клавишей', 'пауза клавишей', 'громче клавишей', 'тише клавишей']

- id: files.reveal
  desc: 'Показать файл в проводнике'
  executor: agent
  reversible: true
  confirm: false
  followup: ack
  triggers: ['покажи где лежит', 'где лежит файл', 'в проводнике', 'открой папку с файлом']
  param:
    name: file
    pattern: '(?:где лежит(?: файл)?|покажи файл|папку с файлом)\s+(.+?)(?:\s+в проводнике)?$'
    required: ask

- id: files.recent
  desc: 'Недавние файлы'
  executor: agent
  reversible: true
  confirm: false
  followup: llm
  triggers: ['недавние файлы', 'последние файлы', 'какие файлы я открывал', 'что я недавно открывал']

- id: files.copy
  desc: 'Скопировать файл: что и куда'
  executor: agent
  reversible: true
  confirm: false
  followup: ack
  triggers: ['скопируй файл', 'скопируй документ', 'сделай копию файла']

- id: files.move
  desc: 'Переместить файл: что и куда'
  executor: agent
  reversible: false
  confirm: true
  confirm_prompt: 'Переместить файл. Точно? Скажи «да».'
  followup: ack
  triggers: ['перенеси файл', 'перемести файл', 'перенеси документ', 'перемести документ']

- id: files.delete
  desc: 'Удалить файл в корзину'
  executor: agent
  reversible: true
  confirm: true
  confirm_prompt: 'Удалить файл в корзину. Точно? Скажи «да».'
  followup: ack
  triggers: ['удали файл', 'удали документ', 'сотри файл', 'отправь в корзину']
  param:
    name: file
    pattern: '(?:удали|сотри) (?:файл|документ)\s+(.+)|отправь в корзину (?:файл\s+)?(.+)'
    required: ask

- id: ui.click
  desc: 'Нажать кнопку или элемент в активном окне'
  executor: agent
  reversible: false
  confirm: false
  followup: ack
  triggers: ['нажми кнопку', 'нажми на кнопку', 'кликни на', 'кликни по']
  param:
    name: element
    pattern: '(?:нажми(?: на)? кнопку|кликни (?:на|по))\s+(.+)'
    required: ask

- id: ui.type
  desc: 'Вписать текст в поле активного окна'
  executor: agent
  reversible: false
  confirm: false
  followup: ack
  triggers: ['впиши', 'введи в поле', 'заполни поле']
  param:
    name: text
    pattern: '(?:впиши|введи в поле|заполни поле)\s+(.+)'
    required: ask

- id: ui.scroll
  desc: 'Прокрутить активное окно'
  executor: agent
  reversible: true
  confirm: false
  followup: ack
  triggers: ['прокрути окно', 'пролистай окно', 'прокрути список', 'пролистай список']

- id: ui.read
  desc: 'Прочитать текст активного окна'
  executor: agent
  reversible: true
  confirm: false
  followup: llm
  triggers: ['прочитай окно', 'что написано в окне', 'прочитай что написано', 'прочитай текст окна']

# computer.do — агент сам выполняет задачу по шагам (computer_step на
# сервере: кадр → одно действие). Только при COMPUTER_USE=1: иначе
# декларация не попадает в роутер (sakura_core/bridge.py).
- id: computer.do
  desc: 'Выполнить задачу на компьютере по шагам (сама кликает и печатает)'
  executor: agent
  reversible: false
  confirm: true
  confirm_prompt: 'Буду сама управлять компьютером, пока не сделаю. Точно? Скажи «да».'
  followup: ack
  triggers: ['сделай на компьютере', 'сделай сама на компьютере', 'выполни на компьютере', 'сделай за меня на компьютере']
  param:
    name: goal
    pattern: '(?:сделай(?: сама| за меня)?|выполни) на компьютере\s*:?\s*(.+)'
    required: ask

# browser.task — Сакура сама ведёт задачу в браузере (browser_step на
# сервере: снимок вкладки → один инструмент; тесты решает решатель).
# Только при BROWSER_AGENT=1 (sakura_core/bridge.py). confirm выставляет
# мост по BROWSER_CONFIRM_SENSITIVE.
- id: browser.task
  desc: 'Выполнить задачу в браузере по шагам (формы, онлайн-тесты)'
  executor: vps
  reversible: false
  confirm: false
  confirm_prompt: 'Буду сама действовать в браузере, пока не сделаю. Точно? Скажи «да».'
  followup: ack
  triggers: ['сделай в браузере', 'сделай сама в браузере', 'выполни в браузере', 'сделай за меня в браузере']
  param:
    name: goal
    pattern: '(?:сделай(?: сама| за меня)?|выполни) в браузере\s*:?\s*(.+)'
    required: ask

- id: browser.stop
  desc: 'Остановить задачу в браузере'
  executor: vps
  reversible: true
  confirm: false
  followup: ack
  triggers: ['стоп задача', 'останови задачу', 'отмени задачу', 'стоп браузер', 'хватит в браузере', 'останови браузер']
