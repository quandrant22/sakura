# ── Управление компьютером (feat/pc-control) ─────────────────────────
# Источник правды — настольный клиент: desktop/docs/CONTROL.md («Справочник
# новых действий») и desktop/core/control/registry.py (ACTIONS: reversible,
# confirm). Формат arg — capabilities/pc_control.py. confirm: true — сервер
# сначала спрашивает, после «да» шлёт команду с "confirmed": true.
# Старые system.lock / system.sleep остаются для agent/ (свои фразы).

- id: window.minimize
  desc: 'Свернуть окно (активное или по названию)'
  executor: agent
  reversible: true
  confirm: false
  followup: ack
  triggers: ['сверни окно', 'спрячь окно', 'убери окно', 'сверни это окно']
  param:
    name: window
    pattern: '(?:сверни|спрячь|убери) окно\s+(.+)'
    required: false

- id: window.maximize
  desc: 'Развернуть окно на весь экран'
  executor: agent
  reversible: true
  confirm: false
  followup: ack
  triggers: ['разверни окно', 'на весь экран', 'максимизируй окно', 'окно побольше']
  param:
    name: window
    pattern: 'разверни\s+(?!окно\b|на весь)(.+?)\s+на весь экран'
    required: false

- id: window.restore
