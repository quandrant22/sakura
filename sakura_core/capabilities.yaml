# Реестр способностей Сакуры v3
# Сгенерирован из кода 15c2509, триггеры для 39 действий дописаны вручную.
#
# ПРАВИЛА МАТЧИНГА (обязательны, иначе реестр ломается):
#   1. Только по границам слов. Подстрока внутри слова не считается совпадением —
#      иначе 'лайк' сработает внутри 'дизлайк'.
#   2. Выигрывает САМЫЙ ДЛИННЫЙ совпавший триггер, не первый по порядку.
#      Иначе 'не нравится трек' будет распознано как 'нравится' → лайк вместо дизлайка.
#   3. Действия с полем context проверяются только при выполнении условия.
#      playing:music — играет музыка; window:youtube — активное окно YouTube;
#      window:browser — активное окно браузера.
#
# legacy — как действие называлось в v2. Поле временное, удаляется после переноса.

# Реестр способностей Сакуры v3 — черновик, сгенерирован из кода 15c2509
# Канонические id: domain.verb. legacy — как действие называлось в v2.
# ПРОВЕРИТЬ ВРУЧНУЮ: desc, params, confirm у всего, что помечено CHECK.
# действий: 70

