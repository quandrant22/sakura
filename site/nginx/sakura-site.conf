# ==============================================================================
# SAKURA AI — NGINX PRODUCTION CONFIGURATION
# Витрина и девлог: https://sakura.yourdomain.com / основной домен
# Оптимизировано для отдачи тяжелого медиа-контента (1080p MP4 / WebM видео,
# поддержка HTTP Range 206 Partial Content для плавной перемотки без задержек)
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name sakura.yourdomain.com; # Замените на ваш домен

    # Редирект на HTTPS в проде
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sakura.yourdomain.com; # Замените на ваш домен

    # SSL сертификаты (например, Let's Encrypt / Certbot)
    # ssl_certificate /etc/letsencrypt/live/sakura.yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/sakura.yourdomain.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Корневой каталог витрины
    root /opt/sakura/site;
    index index.html;

    # Безопасные заголовки
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Производительность ядра ввода-вывода (High-throughput zero-copy)
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Сжатие текстовых ресурсов
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ==========================================================================
    # ПОТОКОВОЕ ВИДЕО (.mp4 / .webm) — HTTP 206 PARTIAL CONTENT
    # Позволяет браузеру мгновенно перематывать видео в любую точку без скачивания
    # всего файла целиком, используя стандартные Range-заголовки.
    # ==========================================================================
    location ~* \.(mp4|webm)$ {
        # Включение поддержки Range-запросов
        max_ranges 512;

        # Буферизация выключена для мгновенного стриминга
        aio threads;
        directio 4m;

        # Кэширование браузером и CDN
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header Accept-Ranges bytes;

        # Разрешить CORS при необходимости шаринга видео
        add_header Access-Control-Allow-Origin *;

        try_files $uri =404;
    }

    # Статические изображения и графические диаграммы
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 14d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Стили и JavaScript
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }

    # Главная страница и fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Логи
    access_log /var/log/nginx/sakura_site_access.log;
    error_log /var/log/nginx/sakura_site_error.log warn;
}
