[[commands]]
id = "clip_that"
type = "action"
action = "clip"
args = "30"
priority = 25
description = "Save last 30-60s clip of gameplay or screen to MP4"

phrases.ru = [
    "заклипай это",
    "заклипай",
    "сохрани клип",
    "сделай клип",
    "сохрани откат",
    "откат",
]
phrases.en = [
    "clip that",
    "save clip",
]

