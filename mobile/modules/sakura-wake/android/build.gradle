plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.sakurawake'
version = '1.0.0'

android {
  namespace "expo.modules.sakurawake"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
    consumerProguardFiles 'consumer-rules.pro'
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

repositories {
  mavenCentral()
}

dependencies {
  implementation 'com.alphacephei:vosk-android:0.3.47'
  implementation 'net.java.dev.jna:jna:5.13.0@aar'

  def androidxMedia3Version = "1.9.1"
  implementation "androidx.media3:media3-session:$androidxMedia3Version"
  implementation "androidx.media3:media3-common:$androidxMedia3Version"
  implementation 'androidx.core:core-ktx:1.15.0'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
