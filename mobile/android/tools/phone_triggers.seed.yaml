# Действия телефона (Контракт телефона, п. 2) — временный источник триггеров, пока серверный
# реестр sakura_core/capabilities.yaml не содержит phone.* (см. docs/mobile/DECISIONS.md, D29).
# Формат — как в capabilities.yaml (id, desc, params, triggers). После выката сервера генератор
# берёт phone.* из реестра, этот файл удаляется.

- id: phone.find
  desc: 'Найти телефон: громкий сигнал 30 с'
  triggers: ['найди телефон', 'где телефон', 'где мой телефон', 'потерял телефон', 'позвони мне на телефон']

- id: phone.dnd_on
  desc: 'Не беспокоить на телефоне'
  triggers: ['не беспокоить', 'включи не беспокоить', 'режим не беспокоить', 'тишина на телефоне', 'выключи звук телефона']

- id: phone.dnd_off
  desc: 'Выключить «Не беспокоить»'
  triggers: ['выключи не беспокоить', 'отключи не беспокоить', 'верни звук телефона']

- id: phone.alarm
  desc: 'Будильник на телефоне'
  params:
    - name: time
  triggers: ['поставь будильник', 'разбуди меня', 'будильник на']

- id: phone.timer
  desc: 'Таймер на телефоне'
  params:
    - name: seconds
  triggers: ['поставь таймер', 'засеки', 'таймер на']

- id: phone.flashlight
  desc: 'Фонарик'
  params:
    - name: state
  triggers: ['включи фонарик', 'выключи фонарик', 'фонарик']

- id: phone.volume
  desc: 'Громкость телефона'
  params:
    - name: level
  triggers: ['громкость телефона', 'сделай телефон громче', 'сделай телефон тише']

- id: phone.clipboard
  desc: 'Скопировать текст в буфер телефона'
  params:
    - name: text
  triggers: ['скопируй на телефон', 'отправь в буфер телефона']

- id: phone.open_url
  desc: 'Открыть ссылку на телефоне'
  params:
    - name: url
  triggers: ['открой ссылку на телефоне', 'открой на телефоне сайт']

- id: phone.open_app
  desc: 'Открыть приложение на телефоне'
  params:
    - name: app
  triggers: ['открой на телефоне', 'запусти на телефоне']

- id: phone.media_play_pause
  desc: 'Пауза / продолжить на телефоне'
  triggers: ['пауза на телефоне', 'продолжи на телефоне', 'плей на телефоне']

- id: phone.media_next
  desc: 'Следующий трек на телефоне'
  triggers: ['следующий трек на телефоне', 'дальше на телефоне']

- id: phone.media_prev
  desc: 'Предыдущий трек на телефоне'
  triggers: ['предыдущий трек на телефоне', 'назад на телефоне']

- id: phone.notify
  desc: 'Уведомление на телефоне'
  params:
    - name: text
  triggers: ['напиши на телефон', 'пришли на телефон уведомление']
